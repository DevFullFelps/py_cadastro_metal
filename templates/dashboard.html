<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Metalúrgica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">⚙️ Metalúrgica - Painel de Controle</span>
            <a href="/" class="btn btn-outline-light btn-sm">Voltar ao Cadastro</a>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="row g-4 mb-4">
            
            <div class="col-md-6">
                <div class="card shadow h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Peso por Material</h5>
                    </div>
                    <div class="card-body">
                        {{ grafico_barras | safe }}
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow h-100">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">Participação de Fornecedores</h5>
                    </div>
                    <div class="card-body">
                        {{ grafico_pizza | safe }}
                    </div>
                </div>
            </div>

        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0">Evolução Diária de Entradas</h5>
                    </div>
                    <div class="card-body">
                        {{ grafico_linha | safe }}
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
